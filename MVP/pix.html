<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>itaú · Pix e transferir</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="phone">
  <div class="status">
    <span data-relogio>14:47</span>
    <span class="direita">4G <span class="bateria">65</span></span>
  </div>

  <div class="conteudo">
    <div class="topo">
      <button class="voltar" data-voltar aria-label="Voltar">‹</button>
      <button class="olho" onclick="alert('Ajuda indisponível no protótipo.')" aria-label="Ajuda">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.8-.9 1.5v.2"/><circle cx="12" cy="17" r=".8" fill="currentColor"/></svg>
      </button>
    </div>

    <h1>Pix e transferir</h1>

    <div class="atalhos" style="gap:10px">
      <button class="atalho" onclick="alert('Leitura de QR Code indisponível no protótipo.')" style="background:var(--cinza-fundo)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="3"/><circle cx="12" cy="12.5" r="3.2"/><path d="M9 6l1.5-2h3L15 6"/></svg>
        Ler QR Code
      </button>
      <button class="atalho" onclick="alert('Pix Copia e Cola indisponível no protótipo.')" style="background:var(--cinza-fundo)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="11" height="13" rx="2"/><path d="M9 20h9a2 2 0 0 0 2-2V9"/></svg>
        Pix Copia e Cola
      </button>
      <button class="atalho" onclick="alert('Minhas Chaves indisponível no protótipo.')" style="background:var(--cinza-fundo)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H20M17 12v3"/></svg>
        Minhas Chaves
      </button>
      <button class="atalho" onclick="alert('Gerar QR Code indisponível no protótipo.')" style="background:var(--cinza-fundo)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3M20 20v-3"/></svg>
        Gerar QR Code
      </button>
    </div>

    <p class="secao-titulo" style="font-size:19px">Sugestões pra você</p>

    <button class="linha-item" onclick="alert('Minhas contas indisponível no protótipo.')">
      <span class="icone" style="width:40px;height:40px;border-radius:50%;background:#ffe7d3;color:var(--laranja);display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
      </span>
      <span class="conteudo-item"><strong>Minhas contas</strong></span>
      <span class="seta">›</span>
    </button>

    <button class="linha-item" data-contato="Estevao Dos Santos Vieira" data-banco="Caixa Econômica Federal" data-chave="(11) 9 8123-4455" data-cpf="***.774.902-**">
      <span class="icone" style="width:40px;height:40px;border-radius:8px;background:#0b4b8f;color:#f7a800;display:flex;align-items:center;justify-content:center;font-weight:700">X</span>
      <span class="conteudo-item"><strong>Estevao Dos Santos Vieira</strong><span>Caixa</span></span>
      <span class="seta">›</span>
    </button>

    <button class="linha-item" data-contato="Rodrigo Faber Do Amaral" data-banco="Banco do Brasil S.A." data-chave="rodrigo.amaral@email.com" data-cpf="***.118.330-**">
      <span class="icone" style="width:40px;height:40px;border-radius:8px;background:#fae128;color:#0b3f8f;display:flex;align-items:center;justify-content:center;font-weight:700">BB</span>
      <span class="conteudo-item"><strong>Rodrigo Faber Do Amaral</strong><span>Banco do Brasil</span></span>
      <span class="seta">›</span>
    </button>

    <button class="linha-item" data-contato="Gabriel Barbin Capocci" data-banco="Itaú Unibanco S.A." data-chave="(19) 9 9410-2277" data-cpf="***.560.712-**">
      <span class="icone itau" style="width:40px;height:40px;border-radius:50%;background:#14315c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">itaú</span>
      <span class="conteudo-item"><strong>Gabriel Barbin Capocci</strong><span>Itaú</span></span>
      <span class="seta">›</span>
    </button>

    <div class="espaco"></div>
  </div>

  <div class="barra-fixa">
    <div class="botao-wrap">
      <button class="botao" id="nova">Nova transferência <span class="seta">+</span></button>
    </div>
  </div>

  <div class="barra-nav"><span class="traço"></span></div>
</div>

<script src="app.js"></script>
<script>
  document.getElementById("nova").addEventListener("click", () => {
    limparTransferencia();
    irPara("destinatario.html");
  });

  document.querySelectorAll("[data-contato]").forEach((botao) => {
    botao.addEventListener("click", () => {
      limparTransferencia();
      salvarTransferencia({
        nome: botao.dataset.contato,
        chavePix: botao.dataset.chave,
        cpf: botao.dataset.cpf,
        instituicao: botao.dataset.banco,
      });
      irPara("contato.html");
    });
  });
</script>
</body>
</html>
