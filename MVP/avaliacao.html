<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ia.itaú · Avaliação de segurança</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="phone">
  <div class="status">
    <span data-relogio>14:49</span>
    <span class="direita">4G <span class="bateria">65</span></span>
  </div>

  <div class="chat-topo">
    <span class="ia-marca">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#ec7000"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7L12 2z"/></svg>
      ia.<strong>itaú</strong>
    </span>
    <button class="fechar" id="fechar" aria-label="Fechar">✕</button>
  </div>

  <div class="conteudo chat" id="chat"></div>

  <div class="chat-opcoes" id="opcoes"></div>

  <div class="chat-rodape">
    <div class="chat-campo">
      <input placeholder="Digite aqui" disabled />
      <span class="enviar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ec7000" stroke-width="1.8"><path d="M4 12l16-8-6 8 6 8-16-8z"/></svg>
      </span>
    </div>
    <p class="chat-aviso">Resposta gerada por IA e pode ter informações imprecisas.</p>
  </div>

  <div class="barra-nav"><span class="traço"></span></div>
</div>

<script src="app.js"></script>
<script src="triagem.js"></script>
<script>
  const dados = lerTransferencia();
  const nome = dados.nome || "esse destinatário";
  const valor = dados.valor ? "R$ " + formatarMoeda(dados.valor) : "esse valor";
  const bloco1 = dados.bloco1 || (dados.valor ? montarBloco1(dados) : null);

  const VEREDITOS = [
    { id: "golpe", texto: "Acho que é golpe" },
    { id: "nao_e_golpe", texto: "Acho que não é golpe" },
    { id: "nao_tenho_certeza", texto: "Não tenho certeza" },
  ];
  const TITULO_NIVEL = { alto: "Risco alto de golpe", moderado: "Risco moderado de golpe", baixo: "Risco baixo" };

  const chat = document.getElementById("chat");
  const opcoes = document.getElementById("opcoes");
  let sessaoId = null;

  function horario() {
    const agora = new Date();
    return `${String(agora.getHours()).padStart(2, "0")}:${String(agora.getMinutes()).padStart(2, "0")}`;
  }

  function esc(texto) {
    const div = document.createElement("div");
    div.textContent = texto;
    return div.innerHTML;
  }

  function rolar() {
    requestAnimationFrame(() => (chat.scrollTop = chat.scrollHeight));
  }

  function balaoBot(titulo, html, classe = "") {
    const bloco = document.createElement("div");
    bloco.className = "msg-bot " + classe;
    bloco.innerHTML = `
      <span class="faisca"><svg width="18" height="18" viewBox="0 0 24 24" fill="#ec7000"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7L12 2z"/></svg></span>
      ${titulo ? `<strong>${titulo}</strong>` : ""}
      ${html}`;
    chat.appendChild(bloco);
    rolar();
  }

  function balaoUsuario(texto) {
    const bloco = document.createElement("div");
    bloco.className = "msg-usuario";
    bloco.innerHTML = `<div class="bolha">${esc(texto)}</div><span class="hora">${horario()} <span class="checks">✓✓</span></span>`;
    chat.appendChild(bloco);
    rolar();
  }

  function digitando() {
    const bloco = document.createElement("div");
    bloco.className = "msg-bot digitando";
    bloco.innerHTML = '<span class="ponto"></span><span class="ponto"></span><span class="ponto"></span>';
    chat.appendChild(bloco);
    rolar();
    return bloco;
  }

  // Mostra "digitando" enquanto a chamada à API roda (com um tempo mínimo, pro ritmo do chat).
  async function comDigitando(promessa, minimo = 700) {
    opcoes.innerHTML = "";
    const espera = digitando();
    try {
      const [resultado] = await Promise.all([promessa, new Promise((r) => setTimeout(r, minimo))]);
      return resultado;
    } finally {
      espera.remove();
    }
  }

  function mostrarOpcoes(lista, aoEscolher) {
    opcoes.innerHTML = "";
    lista.forEach((item) => {
      const botao = document.createElement("button");
      botao.className = "chip" + (item.destaque ? " destaque" : "");
      botao.textContent = item.texto;
      botao.addEventListener("click", () => {
        opcoes.querySelectorAll("button").forEach((b) => (b.disabled = true));
        aoEscolher(item);
      });
      opcoes.appendChild(botao);
    });
  }

  function falha(erro, tentarDeNovo) {
    console.error(erro);
    balaoBot(
      "Não consegui concluir a avaliação",
      "<p>O serviço de avaliação não respondeu agora. Você pode tentar de novo ou voltar e revisar a transferência com calma.</p>"
    );
    mostrarOpcoes(
      [{ texto: "Tentar de novo", destaque: true, acao: tentarDeNovo }, { texto: "Voltar", acao: () => irPara("confirmacao.html") }],
      (item) => item.acao()
    );
  }

  function mostrarPergunta(etapa) {
    const q = etapa.pergunta;
    balaoBot(
      "",
      `<span class="progresso">Pergunta ${etapa.progresso.atual} de ${etapa.progresso.total}</span>
       <p class="didatica">${esc(q.texto_didatico)}</p>
       <p class="pergunta">${esc(q.pergunta)}</p>`
    );
    mostrarOpcoes(q.alternativas, (alt) => responder(q, alt));
  }

  async function iniciar() {
    if (!bloco1) return irPara("destinatario.html");
    try {
      const etapa = await comDigitando(iniciarSessao(bloco1));
      sessaoId = etapa.sessao_id;
      salvarTransferencia({ sessaoTriagem: sessaoId });
      mostrarPergunta(etapa);
    } catch (erro) {
      falha(erro, iniciar);
    }
  }

  async function responder(pergunta, alternativa) {
    balaoUsuario(alternativa.texto);
    try {
      const etapa = await comDigitando(enviarResposta(sessaoId, pergunta.id, alternativa.id), 500);
      if (etapa.status === "coacao") return mostrarCoacao(etapa.orientacao_seguranca);
      if (etapa.status === "aguardando_veredito") return perguntarVeredito();
      mostrarPergunta(etapa);
    } catch (erro) {
      falha(erro, () => mostrarOpcoes(pergunta.alternativas, (alt) => responder(pergunta, alt)));
    }
  }

  function perguntarVeredito() {
    balaoBot(
      "Agora é com você",
      `<p>Depois de tudo isso, o que você acha: esse Pix de ${esc(valor)} para ${esc(nome)} é golpe?</p>`
    );
    mostrarOpcoes(VEREDITOS, async (v) => {
      balaoUsuario(v.texto);
      try {
        await comDigitando(enviarVeredito(sessaoId, v.id), 300);
        const resultado = await comDigitando(buscarResultado(sessaoId), 600);
        mostrarResultado(resultado);
      } catch (erro) {
        falha(erro, perguntarVeredito);
      }
    });
  }

  function mostrarResultado(r) {
    const pct = Math.round(r.score_refinado * 100);
    const paragrafos = r.explicacao_gerada.split(/\n+/).filter(Boolean).map((t) => `<p>${esc(t)}</p>`).join("");
    balaoBot(
      `${TITULO_NIVEL[r.nivel_risco]} · ${pct}%`,
      `<div class="medidor"><span class="${r.nivel_risco}" style="width:${pct}%"></span></div>${paragrafos}`
    );
    salvarTransferencia({ triagem: { valor: dados.valor, chavePix: dados.chavePix, nivel: r.nivel_risco } });
    const arriscado = r.nivel_risco !== "baixo";

    // Decisão de produto: nunca bloquear. O usuário escolhe; registramos se seguiu a recomendação.
    mostrarOpcoes(
      [
        { texto: "Cancelar transferência", destaque: arriscado, acao: () => sair(arriscado, () => { limparTransferencia(); irPara("pix.html"); }) },
        { texto: "Revisar dados da transferência", acao: () => irPara("confirmacao.html") },
        { texto: "Concluir mesmo assim", destaque: !arriscado, acao: () => sair(!arriscado, () => irPara("comprovante.html")) },
      ],
      (item) => item.acao()
    );
  }

  async function sair(seguiuRecomendacao, destino) {
    await registrarDecisao(sessaoId, seguiuRecomendacao);
    destino();
  }

  function mostrarCoacao(orientacao) {
    balaoBot("Sua segurança em primeiro lugar", `<p>${esc(orientacao)}</p>`, "seguranca");
    opcoes.innerHTML = "";
    const ligar = document.createElement("a");
    ligar.className = "chip destaque";
    ligar.href = "tel:190";
    ligar.textContent = "Ligar 190";
    const cancelar = document.createElement("button");
    cancelar.className = "chip";
    cancelar.textContent = "Cancelar transferência";
    cancelar.addEventListener("click", () => {
      limparTransferencia();
      irPara("home.html");
    });
    opcoes.append(ligar, cancelar);
  }

  document.getElementById("fechar").addEventListener("click", () => irPara("confirmacao.html"));

  balaoBot(
    "",
    `<p>Oi, Felipe! Sou a <strong>ia.itaú</strong> e vou te ajudar a checar se esse Pix de ${esc(valor)} para ${esc(nome)} é seguro. ` +
      `São 3 perguntas rápidas — e em cada uma eu te conto um truque que golpistas costumam usar.</p>`
  );
  setTimeout(iniciar, 600);
</script>
</body>
</html>
