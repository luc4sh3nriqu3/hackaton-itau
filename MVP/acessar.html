<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>itaú · Acessar</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="phone fundo-cinza">
  <div class="status">
    <span data-relogio>14:46</span>
    <span class="direita">4G <span class="bateria">66</span></span>
  </div>

  <div class="conteudo fundo-cinza">
    <div class="perfil-topo">
      <div class="avatar" data-ir="perfil.html">JP</div>
      <div class="nomes">
        <strong>Olá, José</strong>
        <span>CPF •••.327.238-••</span>
      </div>
      <button class="botao-contorno" onclick="alert('Troca de conta indisponível no protótipo.')">Trocar conta</button>
    </div>

    <div class="blocos">
      <button class="bloco largo" data-ir="home.html">
        <span class="icone-laranja"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0"/></svg></span>
        <span>Acessar</span>
      </button>

      <button class="bloco" data-ir="pix.html">
        <span class="icone-laranja"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg></span>
        <span>Pix e transferir</span>
      </button>
      <button class="bloco" onclick="alert('Pagar indisponível no protótipo.')">
        <span class="icone-laranja"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5v14M8 5v14M12 5v14M16 5v14M20 5v14"/></svg></span>
        <span>Pagar</span>
      </button>
      <button class="bloco" onclick="alert('Extrato indisponível no protótipo.')">
        <span class="icone-laranja"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7h14M5 12h14M5 17h14"/></svg></span>
        <span>Extrato</span>
      </button>
      <button class="bloco" onclick="alert('Cartão virtual indisponível no protótipo.')">
        <span class="icone-laranja"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="4 3"><rect x="3" y="6" width="18" height="12" rx="3"/></svg></span>
        <span>Cartão virtual</span>
      </button>
    </div>

    <div class="blocos tres">
      <button class="bloco" onclick="alert('Aproximar para Pix indisponível no protótipo.')">
        <span class="icone-laranja"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a8 8 0 0 1 0 8M10 6a12 12 0 0 1 0 12M14 4a16 16 0 0 1 0 16"/></svg></span>
        <span>Aproximar para Pix</span>
      </button>
      <button class="bloco" onclick="alert('iToken indisponível no protótipo.')">
        <span class="icone-laranja"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="12" rx="9" ry="6"/><circle cx="12" cy="12" r="2"/></svg></span>
        <span>iToken</span>
      </button>
      <button class="bloco" onclick="alert('Ajuda indisponível no protótipo.')">
        <span class="icone-laranja"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.8-.9 1.5v.2"/><circle cx="12" cy="17" r=".8" fill="currentColor"/></svg></span>
        <span>Ajuda</span>
      </button>
    </div>
  </div>

  <div class="barra-nav"><span class="traço"></span></div>
</div>

<script src="app.js"></script>
</body>
</html>
